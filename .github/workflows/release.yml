name: Release Workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions: write-all

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-26.04

    steps:
      # Check out the repository
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up build env
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.17
          install: true
          cache: true
          experimental: true
      # Install dependencies
      - name: Install dependencies
        run: go mod tidy
      # Run tests
      - name: Run tests
        run: go test ./...
      # Build the package
      - name: Build
        run: go build ./...

  release:
    name: Release
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    runs-on: ubuntu-26.04
    needs: build-and-test # Only run if the build-and-test job succeeds

    steps:
      # Check out the repository
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up build env
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.17
          install: true
          cache: true
          experimental: true
        env:
          MISE_ENV: release
      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISE_ENV: release
        run: mise tasks run release

  publish:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
    needs:
      - release
    continue-on-error: true
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0
      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-efi-aarch64 binfmt-support
      - name: Set up build env
        uses: jdx/mise-action@v5
        with:
          version: 2026.9.17
          install: true
          cache: true
          experimental: true
      - name: Build and publish container image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0)
          echo "Latest tag: $LATEST_TAG"
          # pack build ghcr.io/hashi-at-home/nomad-step-up-operator:latest --platform ${{ matrix.platform }} -d project.toml --publish
          mise task run pack ${{ matrix.platform }}
